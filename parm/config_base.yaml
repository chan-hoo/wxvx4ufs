app:
  account: epic
  exp_case_name: test_gw
  platform: ursa
  run_type: ctest
  workflow_manager: None
  workflow_type: global_workflow
nco_vars:
  COMINglobal_workflow: '{{ HOMEwxvx }}/fix/data_{{ app.platform }}/ctest/global_workflow/forecast'
  envir: test
  KEEPDATA: 'YES'
  model_ver: v0.0.1
  NET: test_net
  OPS_PATH: '{{ HOMEwxvx }}/parm/PTMP'
  RUN: '{{ app.exp_case_name }}'
config_common:
  - app
  - nco_vars
task_list:
  - vx_grid2grid
  - postwxvx_grid
tasks:
  vx_grid2grid:
    groups:
      - common
      - vx_grid2grid
    hpc:
      memory_per_node: 128G
      nprocs: 1
      walltime: "00:20:00"
    external_data: true
  postwxvx_grid:
    groups:
      - common
      - postwxvx_grid
    hpc:
      memory_per_node: 128G
      nprocs: 1
      walltime: "00:10:00"
    external_data: false
common:
  cycles:
    start: '2021-12-21T00:00:00'
    step: 0
    stop: '2021-12-21T00:00:00'
  leadtimes:
    start: 0
    step: 1
    stop: 3
  meta:
    levels: &levels [1, 5, 10, 20, 50, 100, 200, 500, 700, 850, 1000]
  variables:
    2t:
      level_type: heightAboveGround
      levels:
      - 2
      name: 2t
    10u:
      level_type: heightAboveGround
      levels:
      - 10
      name: 10u
    10v:
      level_type: heightAboveGround
      levels:
      - 10
      name: 10v
    gh:
      level_type: isobaricInhPa
      levels: *levels
      name: gh
    sp:
      level_type: surface
      name: sp
    t:
      level_type: isobaricInhPa
      levels: *levels
      name: t
    u:
      level_type: isobaricInhPa
      levels: *levels
      name: u
    v:
      level_type: isobaricInhPa
      levels: *levels
      name: v
vx_grid2grid:
  forecast:
    name: '{{ app.exp_case_name }}'
    path: '{{ meta.gw_forecast }}/{{ yyyymmdd }}/{{ hh }}/gfs.t{{ hh }}z.pres_a.0p25.f{{ "%03d" % fh }}.grib2'
  meta:
    gw_forecast: '{{ nco_vars.COMINglobal_workflow }}'
    url:
      grid: https://noaa-gfs-bdp-pds.s3.amazonaws.com/gfs.{{ yyyymmdd }}/{{ hh }}/atmos/gfs.t{{ hh }}z.pgrb2.0p25.f{{ "%03d" % fh }}
      obs: https://noaa-reanalyses-pds.s3.amazonaws.com/observations/reanalysis/conv/prepbufr/{{ yyyymmdd[:4] }}/{{ yyyymmdd[4:6] }}/prepbufr/gdas.{{ yyyymmdd }}.t{{ hh }}z.prepbufr.nr
    workdir: '{{ DATA }}'
  paths:
    grids:
      forecast: '{{ meta.workdir }}/grids/forecast'
      truth: '{{ meta.workdir }}/grids/truth'
    obs: '{{ meta.workdir }}/obs'
    run: '{{ meta.workdir }}'
  truth:
    name: GFS
    type: grid
    url: https://noaa-gfs-bdp-pds.s3.amazonaws.com/gfs.{{ yyyymmdd }}/{{ hh }}/atmos/gfs.t{{ hh }}z.pgrb2.0p25.f{{ "%03d" % fh }}
  ncdiffs: true
postwxvx_grid:
  work_path: '{{ DATA }}'
  stat_prefix: 'grid_stat_{{ app.exp_case_name }}'

